services:
  - type: web
    name: orb-royale-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PIN
        sync: false
      - key: EULER_API_KEY
        sync: false
